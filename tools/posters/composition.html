<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обложка · Композиция</title>
<link rel="stylesheet" href="posters.css">
<!-- Тип «Композиция»: плоский цвет проекта + один главный элемент крупно и не по центру
     (+ один второстепенный мелко). Всё прямо, без наклонов.
     Параметры (?p=JSON):
       bg      — цвет фона (#hex), tone ("dark"|"light") — тон рамки
       main    — {img, w (px), x, y (px; можно отрицательные — элемент режется рамкой),
                  kind: "cutout" (drop-shadow по альфе) | "card" (box-shadow по прямоугольнику) | "flat"}
       sub     — то же для второстепенного элемента (необязательно)
       grain   — плотность зерна (по умолчанию .045) -->
</head>
<body>
<div class="poster" id="poster">
  <div class="el" id="sub"><img alt=""></div>
  <div class="el" id="main"><img alt=""></div>
  <div class="grain"><svg xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg></div>
</div>
<script>
  const p = JSON.parse(new URLSearchParams(location.search).get('p') || '{}');
  const poster = document.getElementById('poster');
  poster.style.setProperty('--bg', p.bg || '#1B2A44');
  poster.style.setProperty('--grain', p.grain != null ? p.grain : .045);
  if (p.tone === 'light') poster.classList.add('light');
  function place(id, e) {
    const el = document.getElementById(id);
    if (!e) { el.remove(); return; }
    el.style.left = e.x + 'px'; el.style.top = e.y + 'px'; el.style.width = e.w + 'px';
    if (e.z != null) el.style.zIndex = e.z;
    el.classList.add(e.kind === 'card' ? 'card' : e.kind === 'flat' ? 'flat' : 'shadow');
    if (e.photo) el.classList.add('photo-el');
    el.querySelector('img').src = e.img;
  }
  place('main', p.main); place('sub', p.sub);
</script>
</body></html>
