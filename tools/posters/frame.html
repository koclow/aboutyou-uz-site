<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обложка · Кадр</title>
<link rel="stylesheet" href="posters.css">
<!-- Тип «Кадр»: фото + единая обработка + рамка. Ничего больше.
     Параметры (?p=JSON): img, pos ("50% 40%"), zoom (1..1.3), tone ("dark"|"light"), grain -->
</head>
<body>
<div class="poster" id="poster">
  <div class="photo"><img id="img" alt=""></div>
  <div class="grain"><svg xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg></div>
</div>
<script>
  const p = JSON.parse(new URLSearchParams(location.search).get('p') || '{}');
  const poster = document.getElementById('poster');
  if (p.tone === 'light') poster.classList.add('light');
  if (p.pos) poster.style.setProperty('--pos', p.pos);
  if (p.zoom) poster.style.setProperty('--zoom', p.zoom);
  if (p.grain != null) poster.style.setProperty('--grain', p.grain);
  document.getElementById('img').src = p.img;
</script>
</body></html>
